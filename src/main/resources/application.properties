# Server Configuration
server.port=8080
spring.application.name=winerater

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/winerater_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT Configuration
jwt.secret=${JWT_SECRET:REPLACE_WITH_YOUR_OWN_JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:900000}

# Security
app.security.h2-console-enabled=${H2_CONSOLE_ENABLED:false}

# Logging - No sensitive data in logs
logging.level.root=WARN
logging.level.com.winerater=INFO
